<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SI-FAS | Sistem Informasi Fasilitas</title>
    <style>
      :root {
        --navy: #12334d;
        --blue: #246a8a;
        --teal: #3b8c91;
        --paper: #f4f7f7;
        --ink: #193242;
        --muted: #6c7d86;
        --line: #d9e3e5;
        --white: #fff;
        --gold: #e6a82e;
        --green: #23845d;
        --red: #b3414a;
        --orange: #bd691d;
        --shadow: 0 18px 45px rgba(18, 51, 77, 0.1);
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.5 "Trebuchet MS",
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #f2b134;
        outline-offset: 2px;
      }
      .hidden {
        display: none !important;
      }
      .login-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(
          145deg,
          var(--navy),
          #0c2940 58%,
          var(--teal)
        );
      }
      .login-card {
        width: min(440px, 100%);
        background: #fff;
        border-radius: 16px;
        padding: 38px;
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.22);
      }
      .login-logo {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 12px;
        display: block;
        margin: 0 auto 22px;
      }
      .login-card {
        text-align: center;
      }
      .eyebrow {
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .login-card h1 {
        margin: 8px 0 4px;
        color: var(--navy);
        font-size: 34px;
      }
      .login-card p {
        margin: 0 0 26px;
        color: var(--muted);
      }
      .login-form {
        text-align: left;
        display: grid;
        gap: 13px;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field label,
      .login-form label {
        font-size: 12px;
        font-weight: 700;
      }
      .field input,
      .field select,
      .field textarea,
      .login-form input,
      .toolbar input,
      .toolbar select {
        width: 100%;
        border: 1px solid #c8d6da;
        border-radius: 8px;
        background: #fff;
        padding: 11px 12px;
        color: var(--ink);
      }
      .login-error {
        min-height: 18px;
        color: var(--red);
        font-size: 12px;
      }
      .login-hint {
        margin-top: 17px;
        color: var(--muted);
        font-size: 11px;
      }
      .primary,
      .ghost,
      .danger,
      .text-btn {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 700;
        transition: 0.2s;
      }
      .primary {
        background: var(--navy);
        color: #fff;
      }
      .primary:hover {
        background: #0b273d;
      }
      .ghost {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .ghost:hover {
        border-color: var(--blue);
        background: #f7fbfb;
      }
      .danger {
        background: var(--red);
        color: #fff;
      }
      .text-btn {
        background: transparent;
        color: var(--blue);
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 256px;
        position: fixed;
        inset: 0 auto 0 0;
        padding: 25px 17px;
        background: var(--navy);
        color: #fff;
        display: flex;
        flex-direction: column;
        z-index: 5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 10px 30px;
      }
      .brand img {
        width: 39px;
        height: 39px;
        object-fit: cover;
        border-radius: 9px;
      }
      .brand strong {
        display: block;
        font-size: 18px;
      }
      .brand small {
        display: block;
        color: #b9d0d9;
        font-size: 10px;
        margin-top: 2px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        border: 0;
        background: transparent;
        color: #bdd3db;
        text-align: left;
        padding: 12px 13px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .nav button:hover,
      .nav button.active {
        background: #285876;
        color: #fff;
      }
      .nav-icon {
        width: 19px;
        text-align: center;
        font-weight: 700;
      }
      .side-foot {
        margin-top: auto;
        color: #9db7c1;
        font-size: 11px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        padding: 15px 10px;
      }
      .main {
        margin-left: 256px;
        min-width: 0;
        flex: 1;
      }
      .topbar {
        height: 72px;
        position: sticky;
        top: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 42px;
        background: rgba(255, 255, 255, 0.94);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(8px);
      }
      .crumb {
        color: var(--muted);
        font-size: 13px;
      }
      .crumb b {
        color: var(--ink);
      }
      .account-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #e4f1f7;
        color: var(--blue);
        font-weight: 800;
      }
      .content {
        max-width: 1450px;
        margin: auto;
        padding: 36px 42px 60px;
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }
      .hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 27px;
      }
      .eyebrow2 {
        color: var(--blue);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .hero h1 {
        font-size: clamp(27px, 3vw, 39px);
        line-height: 1.08;
        margin: 7px 0 9px;
      }
      .hero p {
        color: var(--muted);
        margin: 0;
        max-width: 640px;
      }
      .hero-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 25px;
      }
      .stat,
      .panel,
      .report-card {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .stat {
        padding: 18px;
        position: relative;
        overflow: hidden;
      }
      .stat:before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--blue);
      }
      .stat:nth-child(2):before {
        background: var(--gold);
      }
      .stat:nth-child(3):before {
        background: var(--orange);
      }
      .stat:nth-child(4):before {
        background: var(--green);
      }
      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .stat strong {
        font-size: 29px;
        display: block;
        margin-top: 3px;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 0 13px;
      }
      .section-head h2 {
        font-size: 19px;
        margin: 0;
      }
      .section-head small {
        color: var(--muted);
      }
      .report-list {
        display: grid;
        gap: 10px;
      }
      .report-card {
        padding: 17px 19px;
        display: grid;
        grid-template-columns: minmax(220px, 1.6fr) repeat(3, 1fr) auto;
        gap: 15px;
        align-items: center;
      }
      .report-card:hover {
        border-color: #9bc3cd;
        box-shadow: var(--shadow);
      }
      .report-main strong {
        display: block;
        font-size: 15px;
      }
      .report-main small,
      .meta small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .meta {
        font-size: 13px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 99px;
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }
      .badge:before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .s-menunggu {
        color: #a76500;
        background: #fff1d5;
      }
      .s-diproses {
        color: var(--orange);
        background: #ffeadf;
      }
      .s-terverifikasi {
        color: var(--blue);
        background: #e4f1f7;
      }
      .s-selesai {
        color: var(--green);
        background: #e3f4ea;
      }
      .s-ditolak {
        color: var(--red);
        background: #fde5e7;
      }
      .empty {
        padding: 42px;
        text-align: center;
        background: #fff;
        border: 1px dashed #b8cdd2;
        border-radius: var(--radius);
        color: var(--muted);
      }
      .empty strong {
        display: block;
        color: var(--ink);
        font-size: 17px;
        margin-bottom: 4px;
      }
      .panel {
        padding: 22px;
        margin-bottom: 18px;
      }
      .panel h2 {
        font-size: 19px;
        margin: 0 0 16px;
      }
      .profile-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .profile-item small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }
      .profile-item strong {
        display: block;
        margin-top: 2px;
      }
      .toolbar {
        display: grid;
        grid-template-columns: minmax(220px, 2fr) repeat(2, 1fr) auto;
        gap: 9px;
        padding: 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin-bottom: 13px;
      }
      .table-wrap {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: auto;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }
      .data-table th,
      .data-table td {
        padding: 13px 14px;
        text-align: left;
        border-bottom: 1px solid #edf1f2;
      }
      .data-table th {
        background: #f8fbfb;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .data-table input,
      .data-table select {
        width: 100%;
        border: 1px solid #c8d6da;
        border-radius: 6px;
        padding: 7px;
        background: #fff;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .form-grid .full {
        grid-column: 1/-1;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(10, 30, 43, 0.58);
        display: none;
        place-items: center;
        padding: 20px;
        z-index: 20;
      }
      .modal.open {
        display: grid;
      }
      .modal-card {
        width: min(760px, 100%);
        max-height: calc(100vh - 40px);
        overflow: auto;
        background: #fff;
        border-radius: 13px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.22);
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 20px 24px 15px;
        border-bottom: 1px solid var(--line);
      }
      .modal-head h2 {
        margin: 0;
        font-size: 20px;
      }
      .close {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 25px;
        line-height: 1;
      }
      .modal-body {
        padding: 22px 24px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      .detail-item small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
      }
      .detail-item strong {
        display: block;
        margin-top: 2px;
      }
      .detail-full {
        grid-column: 1/-1;
      }
      .timeline {
        border-left: 2px solid #cbdde1;
        margin: 22px 0 0 8px;
        padding-left: 20px;
        display: grid;
        gap: 12px;
      }
      .timeline strong {
        display: block;
        font-size: 13px;
      }
      .timeline small {
        color: var(--muted);
      }
      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 40;
        background: var(--ink);
        color: #fff;
        padding: 12px 16px;
        border-radius: 8px;
        border-left: 4px solid var(--gold);
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition: 0.25s;
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }
      @media (max-width: 1050px) {
        .sidebar {
          width: 220px;
        }
        .main {
          margin-left: 220px;
        }
        .topbar,
        .content {
          padding-left: 25px;
          padding-right: 25px;
        }
        .report-card {
          grid-template-columns: 1.5fr repeat(2, 1fr);
        }
        .report-card .meta:nth-of-type(2) {
          display: none;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .toolbar {
          grid-template-columns: 1fr 1fr;
        }
        .toolbar input {
          grid-column: 1/-1;
        }
      }
      @media (max-width: 720px) {
        .app {
          display: block;
        }
        .sidebar {
          position: static;
          width: 100%;
          padding: 14px 16px;
        }
        .brand {
          padding: 0 4px 14px;
        }
        .nav {
          display: flex;
          overflow: auto;
          gap: 4px;
        }
        .nav button {
          white-space: nowrap;
          padding: 8px 10px;
          font-size: 12px;
        }
        .side-foot {
          display: none;
        }
        .main {
          margin: 0;
        }
        .topbar {
          height: 58px;
          padding: 0 16px;
        }
        .account-chip span {
          display: none;
        }
        .content {
          padding: 24px 16px 44px;
        }
        .hero {
          display: block;
        }
        .hero-actions {
          justify-content: flex-start;
          margin-top: 17px;
        }
        .hero-actions button {
          flex: 1;
        }
        .report-card {
          display: block;
          padding: 16px;
        }
        .report-main {
          margin-bottom: 13px;
        }
        .report-card .meta {
          display: flex;
          justify-content: space-between;
          border-top: 1px solid #edf1f2;
          padding-top: 8px;
          margin-top: 8px;
        }
        .report-card .primary,
        .report-card .ghost {
          width: 100%;
          margin-top: 12px;
        }
        .stats {
          gap: 9px;
        }
        .stat {
          padding: 14px;
        }
        .stat strong {
          font-size: 25px;
        }
        .profile-grid,
        .form-grid,
        .detail-grid {
          grid-template-columns: 1fr;
        }
        .form-grid .full,
        .detail-full {
          grid-column: auto;
        }
        .toolbar {
          grid-template-columns: 1fr;
          padding: 11px;
        }
        .toolbar input {
          grid-column: auto;
        }
        .table-wrap {
          border-radius: 8px;
        }
        .modal {
          padding: 10px;
        }
        .modal-card {
          max-height: calc(100vh - 20px);
        }
        .modal-head,
        .modal-body {
          padding: 17px;
        }
        .modal-actions {
          flex-direction: column-reverse;
        }
        .modal-actions button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <section id="loginPage" class="login-page">
      <div class="login-card">
        <img
          class="login-logo"
          src="images/yasbam.jpg"
          alt="Logo SMK YASBAM Kota Bogor"
        />
        <div class="eyebrow">Sistem Informasi Fasilitas</div>
        <h1>SI-FAS</h1>
        <p>SMK YASBAM KOTA BOGOR</p>
        <form id="loginForm" class="login-form">
          <div class="field">
            <label for="loginName">Nama akun</label
            ><input id="loginName" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label
            ><input
              id="loginPassword"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <div id="loginError" class="login-error"></div>
          <button class="primary" type="submit">Masuk ke aplikasi</button>
        </form>
        <div class="login-hint">
          Gunakan akun yang telah terdaftar pada perangkat ini.
        </div>
      </div>
    </section>
    <div id="app" class="app hidden">
      <aside class="sidebar">
        <div class="brand">
          <img src="images/yasbam.jpg" alt="Logo SMK YASBAM" />
          <div><strong>SI-FAS</strong><small>SMK YASBAM KOTA BOGOR</small></div>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="side-foot">
          Sistem informasi fasilitas sekolah<br />Data tersimpan pada perangkat
          ini
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumb">SI-FAS / <b id="crumb">Dashboard</b></div>
          <div class="account-chip">
            <span id="headerName"></span><span id="headerRole"></span>
            <div id="avatar" class="avatar"></div>
          </div>
        </header>
        <div id="content" class="content"></div>
      </main>
    </div>
    <div id="modal" class="modal">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="modalTitle"></h2>
          <button id="closeModal" class="close" aria-label="Tutup">×</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <script>
      (() => {
        const K = {
          accounts: "sifas_accounts",
          reports: "sifas_reports",
          session: "sifas_session",
          version: "sifas_single_version",
        };
        const STATUSES = [
          "Menunggu",
          "Diproses",
          "Terverifikasi",
          "Selesai",
          "Ditolak",
        ];
        const USER_ROLES = ["Siswa", "Guru", "Staf/Lainnya"];
        const $ = (s) => document.querySelector(s);
        const esc = (v) =>
          String(v ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;",
              })[c],
          );
        const slug = (v) =>
          String(v || "")
            .toLowerCase()
            .replace(/[^a-z]+/g, "-");
        const iso = () => new Date().toISOString();
        const date = (v) =>
          new Intl.DateTimeFormat("id-ID", {
            day: "2-digit",
            month: "short",
            year: "numeric",
          }).format(new Date(v));
        const fullDate = (v) =>
          new Intl.DateTimeFormat("id-ID", {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          }).format(new Date(v));
        function read(key, fallback = []) {
          try {
            return JSON.parse(
              localStorage.getItem(key) || JSON.stringify(fallback),
            );
          } catch {
            return fallback;
          }
        }
        function accounts() {
          return read(K.accounts);
        }
        function reports() {
          return read(K.reports);
        }
        function save(key, value) {
          localStorage.setItem(key, JSON.stringify(value));
        }
        function current() {
          return accounts().find(
            (a) => a.id === sessionStorage.getItem(K.session),
          );
        }
        function idFor(n) {
          const d = new Date();
          return `${String(d.getFullYear()).slice(-2)}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}${String(n).padStart(4, "0")}`;
        }
        function seed() {
          if (localStorage.getItem(K.version) !== "4") {
            save(K.accounts, [
              {
                id: idFor(1),
                username: "admin",
                password: "admin",
                role: "Admin",
                adminSlot: 1,
                active: true,
              },
              {
                id: idFor(10),
                username: "Muhamad Reihan Kaissya",
                password: "reihan",
                role: "Siswa",
                active: true,
              },
              {
                id: idFor(11),
                username: "M. Alfian Yusup",
                password: "alfian",
                role: "Guru",
                active: true,
              },
            ]);
            save(K.reports, []);
            localStorage.setItem(K.version, "4");
            sessionStorage.removeItem(K.session);
          }
        }
        function toast(message) {
          const n = $("#toast");
          n.textContent = message;
          n.classList.add("show");
          clearTimeout(window.toastTimer);
          window.toastTimer = setTimeout(
            () => n.classList.remove("show"),
            3000,
          );
        }
        function owner(r) {
          return r.ownerId || r.reporterId || "";
        }
        function statusClass(s) {
          return `badge s-${slug(s)}`;
        }
        function initials(name) {
          return name
            .split(" ")
            .map((x) => x[0])
            .slice(0, 2)
            .join("")
            .toUpperCase();
        }
        function login() {
          if (current()) {
            showApp();
            return;
          }
          $("#loginForm").onsubmit = (e) => {
            e.preventDefault();
            const a = accounts().find(
              (x) =>
                x.active &&
                x.username.toLowerCase() ===
                  $("#loginName").value.trim().toLowerCase() &&
                x.password === $("#loginPassword").value,
            );
            if (!a) {
              $("#loginError").textContent =
                "Nama akun atau password tidak sesuai.";
              return;
            }
            sessionStorage.setItem(K.session, a.id);
            showApp();
          };
        }
        function showApp() {
          const a = current();
          if (!a) {
            $("#loginPage").classList.remove("hidden");
            $("#app").classList.add("hidden");
            return;
          }
          $("#loginPage").classList.add("hidden");
          $("#app").classList.remove("hidden");
          $("#headerName").textContent = a.username;
          $("#headerRole").textContent = a.role;
          $("#avatar").textContent = initials(a.username);
          buildNav(a);
          route(location.hash.slice(1) || "dashboard", a);
        }
        function buildNav(a) {
          const nav = $("#nav");
          const items =
            a.role === "Admin"
              ? ["dashboard", "reports", "users", "staff", "admins", "profile"]
              : a.role === "Petugas"
                ? ["dashboard", "reports", "profile"]
                : ["dashboard", "create", "mine", "public", "profile"];
          const labels = {
            dashboard: "Dashboard",
            create: "Buat Laporan",
            mine: "Laporan Saya",
            public: "Laporan Sekolah",
            reports: "Laporan Masuk",
            users: "Kelola User",
            staff: "Kelola Petugas",
            admins: "Kelola Admin",
            profile: "Profil Akun",
          };
          const icons = {
            dashboard: "▦",
            create: "+",
            mine: "≡",
            public: "◫",
            reports: "≡",
            users: "♙",
            staff: "♧",
            admins: "♜",
            profile: "◎",
          };
          nav.innerHTML =
            items
              .map(
                (i) =>
                  `<button data-route="${i}"><span class="nav-icon">${icons[i]}</span>${labels[i]}</button>`,
              )
              .join("") +
            `<button id="logout"><span class="nav-icon">↪</span>Logout</button>`;
          nav
            .querySelectorAll("[data-route]")
            .forEach((b) => (b.onclick = () => navigate(b.dataset.route)));
          $("#logout").onclick = () => {
            sessionStorage.removeItem(K.session);
            location.hash = "";
            showApp();
          };
        }
        function navigate(route) {
          location.hash = route;
          routeView(route, current());
        }
        function route(route, a) {
          $("#crumb").textContent =
            {
              dashboard: "Dashboard",
              create: "Buat Laporan",
              mine: "Laporan Saya",
              public: "Laporan Sekolah",
              reports: "Laporan Masuk",
              users: "Kelola User",
              staff: "Kelola Petugas",
              admins: "Kelola Admin",
              profile: "Profil Akun",
            }[route] || "Dashboard";
          $("#nav [data-route].active")?.classList.remove("active");
          $(`#nav [data-route="${route}"]`)?.classList.add("active");
          $("#content").innerHTML = "";
          return routeView(route, a);
        }
        function routeView(route, a) {
          if (!a) return;
          const allowed =
            a.role === "Admin"
              ? ["dashboard", "reports", "users", "staff", "admins", "profile"]
              : a.role === "Petugas"
                ? ["dashboard", "reports", "profile"]
                : ["dashboard", "create", "mine", "public", "profile"];
          if (!allowed.includes(route)) route = "dashboard";
          route = route || "dashboard";
          $("#crumb").textContent = {
            dashboard: "Dashboard",
            create: "Buat Laporan",
            mine: "Laporan Saya",
            public: "Laporan Sekolah",
            reports: "Laporan Masuk",
            users: "Kelola User",
            staff: "Kelola Petugas",
            admins: "Kelola Admin",
            profile: "Profil Akun",
          }[route];
          $("#nav [data-route].active")?.classList.remove("active");
          $(`#nav [data-route="${route}"]`)?.classList.add("active");
          const c = $("#content");
          c.innerHTML =
            route === "dashboard"
              ? dashboard(a)
              : route === "create"
                ? createView()
                : route === "mine"
                  ? listView(a, "mine")
                  : route === "public"
                    ? listView(a, "public")
                    : route === "reports"
                      ? listView(a, "all")
                      : route === "profile"
                        ? profileView(a)
                        : accountsView(a, route);
          bindView(route, a);
          return route;
        }
        function dashboard(a) {
          const rs = reports().filter(
            (r) =>
              a.role === "Admin" || a.role === "Petugas" || owner(r) === a.id,
          );
          const count = (s) => rs.filter((r) => r.status === s).length;
          return `<section class="view active"><div class="hero"><div><div class="eyebrow2">Ringkasan fasilitas sekolah</div><h1>Selamat datang, ${esc(a.username)}.</h1><p>Pantau kondisi fasilitas dan tindak lanjut laporan dari satu ruang kerja.</p></div>${a.role !== "Admin" && a.role !== "Petugas" ? '<div class="hero-actions"><button class="primary" data-route-action="create">+ Buat laporan</button></div>' : ""}</div><div class="stats"><div class="stat"><span>Total laporan</span><strong>${rs.length}</strong></div><div class="stat"><span>Menunggu</span><strong>${count("Menunggu")}</strong></div><div class="stat"><span>Diproses</span><strong>${count("Diproses")}</strong></div><div class="stat"><span>Selesai</span><strong>${count("Selesai")}</strong></div></div><div class="panel"><h2>Ringkasan fasilitas sekolah</h2><p style="margin:0;color:var(--muted)">${rs.length ? `${rs.length} laporan tercatat pada perangkat ini.` : "Belum ada laporan fasilitas yang tercatat."} Gunakan menu laporan untuk melihat detail dan tindak lanjut.</p></div></section>`;
        }
        function card(r) {
          return `<article class="report-card"><div class="report-main"><strong>${esc(r.facilityName)}</strong><small>${esc(r.id)} · ${esc(r.location)}</small></div><div class="meta"><small>Kategori</small>${esc(r.category)}</div><div class="meta"><small>Tanggal</small>${date(r.createdAt)}</div><div class="meta"><small>Status</small><span class="${statusClass(r.status)}">${esc(r.status)}</span></div><button class="ghost" data-detail="${esc(r.id)}">Detail</button></article>`;
        }
        function createView() {
          return `<section class="view active"><div class="hero"><div><div class="eyebrow2">Pelaporan fasilitas</div><h1>Buat laporan baru.</h1><p>Lengkapi informasi fasilitas yang perlu diperiksa.</p></div></div><form id="reportForm" class="panel"><div class="form-grid"><div class="field"><label>Kategori fasilitas</label><select id="category" required><option value="">Pilih kategori</option><option>Kursi</option><option>Meja</option><option>Lampu</option><option>Proyektor</option><option>Komputer</option><option>AC</option><option>Pintu</option><option>Jendela</option><option>Toilet</option><option>Jaringan/Internet</option><option>Lainnya</option></select></div><div class="field"><label>Nama fasilitas</label><input id="facility" required placeholder="Contoh: Proyektor Lab TKJ"></div><div class="field"><label>Lokasi</label><input id="location" required placeholder="Contoh: Gedung A"></div><div class="field"><label>Ruangan</label><input id="room" required placeholder="Contoh: Lab TKJ"></div><div class="field full"><label>Deskripsi kerusakan</label><textarea id="description" required placeholder="Jelaskan kondisi kerusakan secara singkat dan jelas"></textarea></div><div class="field"><label>Tingkat urgensi</label><select id="urgency" required><option value="">Pilih urgensi</option><option>Rendah</option><option>Sedang</option><option>Tinggi</option></select></div></div><div class="modal-actions"><button type="reset" class="ghost">Bersihkan</button><button class="primary">Kirim laporan</button></div></form></section>`;
        }
        function listView(a, mode) {
          let rs = reports();
          if (mode === "mine") rs = rs.filter((r) => owner(r) === a.id);
          if (mode === "public") rs = rs.filter((r) => owner(r) !== a.id);
          return `<section class="view active"><div class="hero"><div><div class="eyebrow2">${mode === "mine" ? "Riwayat pribadi" : mode === "public" ? "Informasi sekolah" : "Pusat penanganan"}</div><h1>${mode === "mine" ? "Laporan Saya" : mode === "public" ? "Laporan Sekolah" : "Laporan Masuk"}</h1><p>${mode === "mine" ? "Lihat perkembangan laporan yang dibuat oleh akun Anda." : mode === "public" ? "Lihat laporan fasilitas pengguna lain tanpa mengubah datanya." : "Periksa dan tindak lanjuti seluruh laporan yang masuk."}</p></div></div><div class="toolbar"><input id="search" placeholder="Cari fasilitas, lokasi, pelapor..."><select id="filterStatus"><option value="">Semua status</option>${STATUSES.map((s) => `<option>${s}</option>`).join("")}</select><button class="ghost" id="resetFilter">Reset</button></div><div id="results" class="report-list">${renderCards(rs)}</div></section>`;
        }
        function renderCards(rs) {
          return rs.length
            ? rs
                .slice()
                .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                .map(card)
                .join("")
            : '<div class="empty"><strong>Tidak ada laporan</strong><span>Belum ada data yang sesuai.</span></div>';
        }
        function profileView(a) {
          return `<section class="view active"><div class="hero"><div><div class="eyebrow2">Pengaturan akun</div><h1>Profil Akun</h1><p>Informasi akun aktif pada perangkat ini.</p></div></div><div class="panel"><h2>Informasi akun</h2><div class="profile-grid"><div class="profile-item"><small>Nama akun</small><strong>${esc(a.username)}</strong></div><div class="profile-item"><small>Jenis pengguna</small><strong>${esc(a.role)}</strong></div><div class="profile-item"><small>Status</small><strong>Aktif</strong></div></div></div></section>`;
        }
        function accountsView(a, route) {
          const role =
            route === "users"
              ? "USER"
              : route === "staff"
                ? "Petugas"
                : "Admin";
          let list = accounts().filter((x) =>
            role === "USER" ? USER_ROLES.includes(x.role) : x.role === role,
          );
          if (route === "admins") list = list.filter((x) => x.adminSlot);
          return `<section class="view active"><div class="hero"><div><div class="eyebrow2">Administrasi</div><h1>${route === "users" ? "Kelola User" : route === "staff" ? "Kelola Petugas" : "Kelola Admin"}</h1><p>Kelola akun dan akses aplikasi secara terpusat.</p></div><div class="hero-actions">${route !== "admins" || list.length < 5 ? '<button class="primary" id="openAccount">+ Tambah akun</button>' : ""}</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>ID internal</th><th>Nama akun</th><th>Role</th><th>Password</th><th>Aksi</th></tr></thead><tbody>${list.map((x) => `<tr><td>${esc(x.id)}</td><td><input data-name="${esc(x.id)}" value="${esc(x.username)}"></td><td>${esc(x.role)}</td><td><input type="password" data-password="${esc(x.id)}" placeholder="Ubah password"></td><td>${x.adminSlot === 1 ? "Admin utama" : `<button class="danger" data-delete="${esc(x.id)}">Hapus</button>`}</td></tr>`).join("") || '<tr><td colspan="5"><div class="empty">Belum ada akun.</div></td></tr>'}</tbody></table></div></section>`;
        }
        function openDetail(r, a) {
          $("#modalTitle").textContent = "Detail laporan";
          $("#modalBody").innerHTML =
            `<div class="detail-grid"><div class="detail-item"><small>ID laporan</small><strong>${esc(r.id)}</strong></div><div class="detail-item"><small>Dibuat</small><strong>${fullDate(r.createdAt)}</strong></div><div class="detail-item"><small>Pelapor</small><strong>${esc(r.reporterName || "Tidak tersedia")} (${esc(r.reporterType || "- ")})</strong></div><div class="detail-item"><small>Status</small><strong><span class="${statusClass(r.status)}">${esc(r.status)}</span></strong></div><div class="detail-item"><small>Fasilitas</small><strong>${esc(r.facilityName)}</strong></div><div class="detail-item"><small>Lokasi</small><strong>${esc(r.location)} · ${esc(r.room)}</strong></div><div class="detail-item detail-full"><small>Deskripsi</small><strong>${esc(r.description)}</strong></div>${r.adminNote ? `<div class="detail-item detail-full"><small>Catatan penanganan</small><strong>${esc(r.adminNote)}</strong></div>` : ""}</div>${a.role === "Admin" || a.role === "Petugas" ? `<div class="panel" style="margin:22px 0 0"><div class="field"><label>Status laporan</label><select id="editStatus">${STATUSES.map((s) => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}</select></div><div class="field" style="margin-top:12px"><label>Catatan penanganan</label><textarea id="editNote">${esc(r.adminNote || "")}</textarea></div><div class="modal-actions"><button class="primary" id="saveReport">Simpan perubahan</button></div></div>` : ""}<h3>Riwayat status</h3><div class="timeline">${(r.statusHistory || [{ status: r.status, timestamp: r.updatedAt || r.createdAt }]).map((h) => `<div><strong>${esc(h.status)}</strong><small>${fullDate(h.timestamp)}</small></div>`).join("")}</div>`;
          $("#modal").classList.add("open");
          $("#saveReport")?.addEventListener("click", () => {
            const list = reports(),
              item = list.find((x) => x.id === r.id),
              next = $("#editStatus").value,
              t = iso();
            if (next !== item.status) {
              item.status = next;
              (item.statusHistory ||= []).push({ status: next, timestamp: t });
            }
            item.adminNote = $("#editNote").value.trim();
            item.updatedAt = t;
            save(K.reports, list);
            $("#modal").classList.remove("open");
            toast("Perubahan laporan tersimpan.");
            routeView(location.hash.slice(1) || "dashboard", a);
          });
        }
        function bindView(route, a) {
          $("[data-route-action]")?.addEventListener("click", (e) =>
            navigate(e.target.dataset.routeAction),
          );
          $("#reportForm")?.addEventListener("submit", (e) => {
            e.preventDefault();
            const t = iso();
            const list = reports();
            list.push({
              id: `LAP-${Date.now()}`,
              ownerId: a.id,
              reporterId: a.id,
              reporterName: a.username,
              reporterType: a.role,
              category: $("#category").value,
              facilityName: $("#facility").value.trim(),
              location: $("#location").value.trim(),
              room: $("#room").value.trim(),
              description: $("#description").value.trim(),
              urgency: $("#urgency").value,
              status: "Menunggu",
              createdAt: t,
              updatedAt: t,
              adminNote: "",
              statusHistory: [{ status: "Menunggu", timestamp: t }],
            });
            save(K.reports, list);
            toast("Laporan berhasil dibuat.");
            navigate("mine");
          });
          $("#openAccount")?.addEventListener("click", () =>
            accountModal(route),
          );
          $("#search")?.addEventListener("input", () => filterList(a, route));
          $("#filterStatus")?.addEventListener("input", () =>
            filterList(a, route),
          );
          $("#resetFilter")?.addEventListener("click", () => {
            $("#search").value = "";
            $("#filterStatus").value = "";
            filterList(a, route);
          });
          document.querySelectorAll("[data-detail]").forEach(
            (b) =>
              (b.onclick = () => {
                const r = reports().find((x) => x.id === b.dataset.detail);
                if (r) openDetail(r, a);
              }),
          );
          document.querySelectorAll("[data-name]").forEach(
            (i) =>
              (i.onchange = () => {
                const list = accounts(),
                  x = list.find((y) => y.id === i.dataset.name);
                if (x) {
                  x.username = i.value.trim() || x.username;
                  save(K.accounts, list);
                  toast("Nama akun diperbarui.");
                }
              }),
          );
          document.querySelectorAll("[data-password]").forEach(
            (i) =>
              (i.onchange = () => {
                if (!i.value) return;
                const list = accounts(),
                  x = list.find((y) => y.id === i.dataset.password);
                if (x) {
                  x.password = i.value;
                  save(K.accounts, list);
                  i.value = "";
                  toast("Password diperbarui.");
                }
              }),
          );
          document.querySelectorAll("[data-delete]").forEach(
            (b) =>
              (b.onclick = () => {
                save(
                  K.accounts,
                  accounts().filter((x) => x.id !== b.dataset.delete),
                );
                routeView(route, a);
                toast("Akun dihapus.");
              }),
          );
        }
        function filterList(a, route) {
          let rs = reports();
          if (route === "mine") rs = rs.filter((r) => owner(r) === a.id);
          if (route === "public") rs = rs.filter((r) => owner(r) !== a.id);
          const q = $("#search").value.toLowerCase(),
            s = $("#filterStatus").value;
          rs = rs
            .filter(
              (r) =>
                !q ||
                [
                  r.facilityName,
                  r.location,
                  r.reporterName,
                  r.description,
                ].some((v) =>
                  String(v || "")
                    .toLowerCase()
                    .includes(q),
                ),
            )
            .filter((r) => !s || r.status === s);
          $("#results").innerHTML = renderCards(rs);
          document.querySelectorAll("[data-detail]").forEach(
            (b) =>
              (b.onclick = () => {
                const r = reports().find((x) => x.id === b.dataset.detail);
                if (r) openDetail(r, a);
              }),
          );
        }
        function accountModal(route) {
          $("#modalTitle").textContent = "Tambah akun";
          $("#modalBody").innerHTML =
            `<form id="accountForm" class="form-grid"><div class="field"><label>Nama akun</label><input id="newName" required></div><div class="field"><label>Password</label><input id="newPassword" required></div><div class="field"><label>Jenis pengguna</label><select id="newRole">${(route === "users" ? USER_ROLES : route === "staff" ? ["Petugas"] : ["Admin"]).map((x) => `<option>${x}</option>`).join("")}</select></div><div class="modal-actions full"><button type="button" class="ghost" id="cancelAccount">Batal</button><button class="primary">Simpan akun</button></div></form>`;
          $("#modal").classList.add("open");
          $("#cancelAccount").onclick = () =>
            $("#modal").classList.remove("open");
          $("#accountForm").onsubmit = (e) => {
            e.preventDefault();
            const list = accounts(),
              role = $("#newRole").value,
              used = list.map((x) => Number(String(x.id).slice(-4)) || 0),
              slot =
                role === "Admin"
                  ? [2, 3, 4, 5].find(
                      (n) => !list.some((x) => x.adminSlot === n),
                    )
                  : null;
            if (role === "Admin" && !slot) {
              toast("Slot Admin 2 sampai 5 sudah penuh.");
              return;
            }
            const next = role === "Admin" ? slot : Math.max(9, ...used, 10) + 1;
            list.push({
              id: idFor(next),
              username: $("#newName").value.trim(),
              password: $("#newPassword").value,
              role,
              adminSlot: role === "Admin" ? slot : null,
              active: true,
            });
            save(K.accounts, list);
            $("#modal").classList.remove("open");
            routeView(route, current());
            toast("Akun berhasil dibuat.");
          };
        }
        $("#closeModal").onclick = () => $("#modal").classList.remove("open");
        $("#modal").onclick = (e) => {
          if (e.target.id === "modal") $("#modal").classList.remove("open");
        };
        window.addEventListener("hashchange", () => {
          const a = current();
          if (a) routeView(location.hash.slice(1) || "dashboard", a);
        });
        seed();
        login();
      })();
    </script>
  </body>
</html>
