<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173f5f" />
    <title>SI-FAS | SMK YASBAM Kota Bogor</title>
    <style>
      :root {
        --blue: #173f5f;
        --blue-light: #246a8a;
        --paper: #f5f8f8;
        --ink: #172b3a;
        --muted: #637381;
        --yellow: #f2b134;
        --line: #d8e2e5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(
          145deg,
          var(--blue) 0%,
          #0f3049 55%,
          var(--blue-light) 100%
        );
        color: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      .welcome {
        width: min(560px, 100%);
        padding: 38px;
        background: var(--paper);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(5, 25, 40, 0.25);
        text-align: center;
      }

      .logo {
        width: 82px;
        height: 82px;
        margin: 0 auto 22px;
        border-radius: 14px;
        object-fit: cover;
        background: var(--yellow);
      }

      .eyebrow {
        margin-bottom: 8px;
        color: var(--blue-light);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--blue);
        font-size: clamp(28px, 6vw, 42px);
        line-height: 1.1;
      }

      p {
        margin: 14px auto 28px;
        max-width: 430px;
        color: var(--muted);
        line-height: 1.6;
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .choice {
        display: flex;
        min-height: 112px;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        text-decoration: none;
        transition:
          transform 0.2s,
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .choice:hover,
      .choice:focus-visible {
        border-color: var(--blue-light);
        box-shadow: 0 10px 22px rgba(23, 63, 95, 0.12);
        transform: translateY(-2px);
      }

      .choice strong {
        color: var(--blue);
        font-size: 17px;
      }

      .choice span {
        color: var(--muted);
        font-size: 13px;
      }

      .footer {
        margin-top: 25px;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 520px) {
        .welcome {
          padding: 28px 18px;
        }

        .choices {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="welcome">
      <img
        class="logo"
        src="images/yasbam.jpg"
        alt="Logo SMK YASBAM Kota Bogor"
      />
      <div class="eyebrow">Sistem Informasi Fasilitas</div>
      <h1>SI-FAS</h1>
      <p>SMK YASBAM KOTA BOGOR</p>

      <div class="choices">
        <a
          class="choice"
          href="user.html"
          target="_blank"
          rel="noopener noreferrer"
        >
          <strong>Portal Pelapor</strong>
          <span>Laporkan masalah fasilitas sekolah</span>
        </a>
        <a
          class="choice"
          href="admin.html"
          target="_blank"
          rel="noopener noreferrer"
        >
          <strong>Panel Pengelola</strong>
          <span>Kelola dan pantau laporan masuk</span>
        </a>
      </div>

      <div class="footer">Demo aplikasi pelaporan fasilitas sekolah</div>
    </main>
  </body>
</html>
